# mqtt/mosquitto.conf  (bruges af api/docker-compose.yml)

listener 1883
# login kræves. /mosquitto/passwd laves ved opstart ud fra MQTT_USERNAME og MQTT_PASSWORD
allow_anonymous false
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
