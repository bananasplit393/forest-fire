# mqtt/mosquitto.conf  (bruges af api/docker-compose.yml)

listener 1883

# websockets til mobilappen
listener 9001
protocol websockets

# login kræves (forestfire / mqtt-password). /mosquitto/passwd laves ved opstart i docker-compose.yml
allow_anonymous false
password_file /mosquitto/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
