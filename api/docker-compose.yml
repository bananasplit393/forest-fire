# Lokal udvikling / enkelt server:  docker compose up --build

services:
  api:
    build:
      context: ./src/ForestFire.Api
      dockerfile: ../../deploy/api/Dockerfile
    image: forest-fire-api:dev
    ports:
      - "8081:8080"   
    environment:
      ConnectionStrings__Default: Host=api-db;Port=5432;Database=forestfire;Username=forestfire;Password=devpassword
      Database__MigrateOnStartup: "true"
      Model__Path: Model/model.onnx
    depends_on:
      api-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  api-db:
    image: postgres:16
    environment:
      POSTGRES_DB: forestfire
      POSTGRES_USER: forestfire
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5434:5432"   
      - api-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  api-db-data:
