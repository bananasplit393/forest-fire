# Lokal udvikling / enkelt server:  docker compose up --build
# Kopiér først .env.example til .env

services:
  api:
    build:
      context: ./src/ForestFire.Api
      dockerfile: ../../deploy/api/Dockerfile
    image: forest-fire-api:dev
    ports:
      - "8081:8080"
    environment:
      ConnectionStrings__Default: Host=api-db;Port=5432;Database=forestfire;Username=forestfire;Password=devpassword
      Database__MigrateOnStartup: "true"
      Model__Path: Model/model.onnx
    depends_on:
      api-db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  # mqtt-servicen (../mqtt), ligesom Edger: lytter på SensorData og FirefighterLocation,
  # sender dem til api og publicerer FireAlert (retained) ved brand
  mqtt:
    build:
      context: ../mqtt
      dockerfile: Dockerfile
    image: forest-fire-mqtt:dev
    environment:
      Mqtt__Host: mosquitto
      Mqtt__Port: "1883"
      Mqtt__Username: ${MQTT_USERNAME}
      Mqtt__Password: ${MQTT_PASSWORD}
      Api__BaseUrl: http://api:8080
    depends_on:
      - mosquitto
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1", memory: 256M }

  api-db:
    image: postgres:16
    environment:
      POSTGRES_DB: forestfire
      POSTGRES_USER: forestfire
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5434:5432"   # så `dotnet run` og pgAdmin/DBeaver kan nå den fra værten
    volumes:
      - api-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # MQTT-brokeren. coap-serveren publicerer SensorData, mqtt-servicen publicerer FireAlert, appen publicerer FirefighterLocation.
  # Config ligger i ../mqtt/mosquitto.conf
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # så coap-serveren, appen og `dotnet run` kan nå den fra værten
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    # laver password-filen ud fra .env og starter så Mosquitto
    command: sh -c 'mosquitto_passwd -c -b /mosquitto/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" && chown mosquitto:mosquitto /mosquitto/passwd && chmod 0700 /mosquitto/passwd && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ../mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

volumes:
  api-db-data:
  mosquitto-data:
